<!DOCTYPE html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link
            rel="stylesheet"
            href="/CSS/bootstrap/dist/css/bootstrap.min.css" />
        <title>Gestora fiomentilhas</title>
    </head>
    <body class="bg-black">
        <header>
            <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
                <div class="container-fluid">
                    <a class="navbar-brand" href="/">Fiomentilhas</a>
                    <button
                        class="navbar-toggler"
                        type="button"
                        data-bs-toggle="collapse"
                        data-bs-target="#navbarSupportedContent"
                        aria-controls="navbarSupportedContent"
                        aria-expanded="false"
                        aria-label="Toggle navigation">
                        <span class="navbar-toggler-icon"></span>
                    </button>
                    <div
                        class="collapse navbar-collapse"
                        id="navbarSupportedContent">
                        <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                            <li class="nav-item dropdown">
                                <a
                                    class="nav-link dropdown-toggle active"
                                    aria-current="true"
                                    href="#"
                                    id="navbarDropdownMenuLink"
                                    role="button"
                                    data-bs-toggle="dropdown"
                                    aria-expanded="false">
                                    Leads
                                </a>
                                <ul
                                    class="dropdown-menu"
                                    aria-labelledby="navbarDropdownMenuLink">
                                    <li>
                                        <a
                                            class="dropdown-item"
                                            href="/cadastrarLead.html">
                                            Cadastro
                                        </a>
                                    </li>
                                    <li>
                                        <a
                                            class="dropdown-item"
                                            href="/atualizarLead.html">
                                            Atualizar
                                        </a>
                                    </li>
                                    <li>
                                        <a
                                            class="dropdown-item"
                                            href="/consultarLead.html">
                                            Consultar
                                        </a>
                                    </li>
                                </ul>
                            </li>
                            <li class="nav-item">
                                <a
                                    class="nav-link"
                                    href="/pipelineDeVendas.html">
                                    Pipeline de vendas
                                </a>
                            </li>
                            <li class="nav-item">
                                <a
                                    class="nav-link"
                                    href="/registrarAtividade.html">
                                    Registrar atividade
                                </a>
                            </li>
                            <li class="nav-item">
                                <a
                                    class="nav-link"
                                    href="/relFunilDeVendas.html">
                                    Relatório do funil de vendas
                                </a>
                            </li>
                        </ul>
                    </div>
                </div>
            </nav>
        </header>
        <main class="d-flex flex-column min-vh-100">
            <form
                class="border border-5 rounded-5 m-3 p-5 bg-light needs-validation"
                method="get"
                action="/cadastrarLead"
                novalidate>
                <div class="mb-3">
                    <input name="post" value=" " hidden />
                    <label for="nome" class="form-label">Nome do lead</label>
                    <input
                        type="text"
                        class="form-control"
                        name="nome"
                        required />
                    <div class="invalid-feedback">
                        Por favor selecione um nome
                    </div>
                </div>
                <div class="mb-3">
                    <label for="telefone" class="form-label">Telefone</label>
                    <input
                        type="text"
                        class="form-control"
                        name="telefone"
                        required />
                    <div class="invalid-feedback">
                        Por favor selecione um telefone
                    </div>
                </div>
                <div class="mb-3">
                    <label for="endereco" class="form-label">Endereço</label>
                    <input
                        type="text"
                        class="form-control"
                        name="endereco"
                        required />
                    <div class="invalid-feedback">
                        Por favor selecione um endereço
                    </div>
                </div>
                <div class="mb-3">
                    <label for="status" class="form-label">Status</label>
                    <select class="form-select" name="status" required>
                        <option selected disabled value="">
                            Escolha um...
                        </option>
                        <option value="Inicio">Inicio</option>
                        <option value="Proposta">Proposta</option>
                        <option value="Negociacao">Negociação</option>
                        <option value="Fechamento">Fechamento</option>
                    </select>
                    <div class="invalid-feedback">
                        Por favor selecione um status
                    </div>
                </div>
                <button type="submit" class="btn btn-primary">Cadastrar</button>
            </form>
        </main>
    </body>
    <script src="/CSS/bootstrap/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/JS/validarCadastroLead.js"></script>
</html>
